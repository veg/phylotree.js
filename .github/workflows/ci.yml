name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    # Windows is included because package scripts have broken there before
    # (#527, #530) without any Linux-visible symptom.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22.x

    - name: Install dependencies
      run: yarn install

    - name: Build project
      run: yarn build

    - name: Run tests
      run: yarn test

    # Platform-independent checks only need to run once.
    - name: Type-check declarations
      if: matrix.os == 'ubuntu-latest'
      run: yarn typecheck

    - name: Run linter
      if: matrix.os == 'ubuntu-latest'
      run: yarn lint
