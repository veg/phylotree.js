name: Documentation Site

on:
  push:
    branches: [master]
  workflow_dispatch:

# This is the only workflow that deploys master to gh-pages (docs.yml just keeps
# API.md current; pr-preview-deploy.yml only writes under pr-preview/).
permissions:
  contents: write

# Shared with pr-preview-deploy.yml so no two pushes race on gh-pages.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-docs-site:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build library
      run: yarn build

    - name: Generate API documentation
      run: yarn docs:generate

    - name: Assemble site
      run: bash scripts/build-site.sh docs-site

    # Replaces the site root but leaves the per-PR previews in place.
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs-site
        branch: gh-pages
        clean: true
        clean-exclude: |
          pr-preview/
        commit-message: Deploy master ${{ github.sha }}
