name: API Documentation

on:
  push:
    branches: [master]
    paths:
      - 'src/**/*.js'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**/*.js'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install dependencies
      run: yarn install

    # API.md is committed alongside the JSDoc changes that affect it. The
    # branch ruleset that gates Dependabot auto-merge also blocks pushes from
    # this workflow, so it checks rather than commits.
    - name: Check that API.md matches the JSDoc comments
      run: |
        if ! yarn docs:validate; then
          echo "::error::API.md is out of date. Run 'yarn docs:generate' and commit the result."
          exit 1
        fi

    - name: Check if API.md changed in this pull request
      id: verify-changed-files
      if: github.event_name == 'pull_request'
      run: |
        git fetch --depth=1 origin "${{ github.base_ref }}"
        if git diff --quiet "origin/${{ github.base_ref }}" -- API.md; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    # The site (including API.md) is deployed to gh-pages by docs-site.yml,
    # which runs on every push to master.

    - name: Comment on PR with documentation preview
      if: github.event_name == 'pull_request' && steps.verify-changed-files.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const apiDocs = fs.readFileSync('API.md', 'utf8');
          const preview = apiDocs.substring(0, 2000) + (apiDocs.length > 2000 ? '\n\n... (truncated)' : '');
          const codeBlock = '```';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## API Documentation Preview\n\nThe API documentation has been updated in this PR. Here is a preview:\n\n${codeBlock}markdown\n${preview}\n${codeBlock}\n\nFull documentation will be available at: https://${context.repo.owner}.github.io/${context.repo.repo}/API.md when merged.`
          });