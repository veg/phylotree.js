name: PR Preview Build

# Builds the site for a pull request with a read-only token (pull requests from
# forks never get write access here). pr-preview-deploy.yml picks up the
# artifacts and publishes them; it never runs code from the pull request.
on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout pull request
      if: github.event.action != 'closed'
      uses: actions/checkout@v7

    - name: Setup Node.js
      if: github.event.action != 'closed'
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install dependencies
      if: github.event.action != 'closed'
      run: yarn install

    - name: Build library and docs
      if: github.event.action != 'closed'
      run: |
        yarn build
        yarn docs:generate

    - name: Assemble site
      if: github.event.action != 'closed'
      run: bash scripts/build-site.sh preview-site

    # Written after checkout: actions/checkout cleans the workspace.
    - name: Record pull request
      run: |
        mkdir -p preview-meta
        echo "${{ github.event.pull_request.number }}" > preview-meta/number
        echo "${{ github.event.action }}" > preview-meta/action
        echo "${{ github.event.pull_request.head.sha }}" > preview-meta/sha

    - name: Upload preview metadata
      uses: actions/upload-artifact@v7
      with:
        name: preview-meta
        path: preview-meta/
        if-no-files-found: error
        retention-days: 1

    - name: Upload preview site
      if: github.event.action != 'closed'
      uses: actions/upload-artifact@v7
      with:
        name: preview-site
        path: preview-site/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
