# Merge Dependabot's security and minor/patch PRs automatically once the
# required checks on master pass. Major version bumps are left for a human,
# since they may need code changes.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'veg/phylotree.js'
    steps:
    - name: Fetch Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@v3
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Enable auto-merge
      if: steps.metadata.outputs.update-type != 'version-update:semver-major'
      run: gh pr merge --auto --merge "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
