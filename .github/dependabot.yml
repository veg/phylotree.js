# Keep dependencies current with as few pull requests as possible.
# Security fixes and routine minor/patch updates each arrive as one grouped PR
# per ecosystem, and dependabot-auto-merge.yml merges them once CI passes;
# major version bumps still come one per package for review, since they may
# need code changes. Version updates are checked monthly; security fixes open
# as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
